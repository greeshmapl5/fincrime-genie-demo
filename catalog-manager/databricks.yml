bundle:
  name: catalog-manager

variables:
  sql_warehouse_id:
    description: SQL Warehouse ID
  genie_space_id:
    description: Genie space ID

resources:
  apps:
    app:
      name: "catalog-manager"
      description: "Business UI for fincrime metadata and data"
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true
      user_api_scopes:
        - sql
        - genie

      # The resources which this app has access to.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        - name: genie-space
          genie_space:
            name: "Investigations Analyst"
            space_id: ${var.genie_space_id}
            permission: CAN_RUN

targets:
  default:
    default: true
    workspace:
      host: https://dbc-417d24d1-5086.cloud.databricks.com

    variables:
      sql_warehouse_id: dea09e931a40e6e8
      genie_space_id: 01f1c320e2c614abb663065c1dad9b98
